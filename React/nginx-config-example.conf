# Пример конфигурации Nginx для React SPA
# Скопируйте этот файл в /etc/nginx/sites-available/fluvion.by
# и создайте симлинк: ln -s /etc/nginx/sites-available/fluvion.by /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name fluvion.by www.fluvion.by;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fluvion.by www.fluvion.by;
    
    root /var/www/fluvion.by/html;
    index index.html;
    
    # SSL сертификаты (настройте свои пути)
    # ssl_certificate /etc/letsencrypt/live/fluvion.by/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fluvion.by/privkey.pem;
    
    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Логи
    access_log /var/log/nginx/fluvion.by.access.log;
    error_log /var/log/nginx/fluvion.by.error.log;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml;
    gzip_disable "msie6";
    
    # КРИТИЧНО: Правильные MIME типы для JavaScript
    # Это исправляет ошибку "Invalid or unexpected token"
    location ~* \.js$ {
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # Кеширование статических файлов
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    
    # КРИТИЧНО: SPA роутинг - все запросы должны возвращать index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Защита от кеширования HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # API прокси (если нужно)
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Отключаем отображение версии Nginx
    server_tokens off;
}






