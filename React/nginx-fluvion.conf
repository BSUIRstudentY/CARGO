# Редирект www → без www
server {
    listen 80;
    server_name www.fluvion.by;
    return 301 https://fluvion.by$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.fluvion.by;

    ssl_certificate /etc/letsencrypt/live/fluvion.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluvion.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://fluvion.by$request_uri;
}

# Основной сервер fluvion.by
server {
    listen 80;
    server_name fluvion.by;
    return 301 https://fluvion.by$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fluvion.by;

    ssl_certificate /etc/letsencrypt/live/fluvion.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluvion.by/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fluvion.by/html;
    index index.html;

    # Логи
    access_log /var/log/nginx/fluvion.by.access.log;
    error_log /var/log/nginx/fluvion.by.error.log;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml;
    gzip_disable "msie6";

    # КРИТИЧНО: Правильные MIME типы для JavaScript файлов
    # Это исправляет ошибку "Invalid or unexpected token"
    location ~* \.js$ {
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # Правильные MIME типы для CSS
    location ~* \.css$ {
        add_header Content-Type "text/css; charset=utf-8";
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # Кеширование статических файлов
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # SPA роутинг - все запросы должны возвращать index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Защита от кеширования HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # API прокси
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Безопасность заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy (CSP)
    # Разрешаем unsafe-eval для Vite production build (необходимо для code splitting)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # Отключаем отображение версии Nginx
    server_tokens off;
}

