services:
  backend:
    image: openjdk:21-jdk-slim
    container_name: backend
    volumes:
      - ./backend.jar:/root/backend.jar
    command: ["java", "-jar", "/root/backend.jar"]
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-CargoDB}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-fluvion_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-CargoDB}
      DB_USERNAME: ${DB_USERNAME:-fluvion_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: "8080"
      HIBERNATE_DDL_AUTO: update
      SHOW_SQL: "false"
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-CargoDB}
      MYSQL_USER: ${DB_USERNAME:-fluvion_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
