spring:
  main:
    lazy-initialization: false # Disabled for better performance in monolithic app
  servlet:
    session:
      timeout: 5m
      cookie:
        http-only: true
        secure: true
        same-site: strict
  application:
    name: demo
  cache:
    type: simple
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 200
        keep-alive: 60s
      thread-name-prefix: async-task-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: scheduled-task-
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    # Используем MySQL если указаны переменные окружения, иначе SQLite
    # SQLite файл: ./data/cargo.sqlite (относительно рабочей директории, где запускается Spring Boot)
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${DB_PATH:./data/cargo.sqlite}?busy_timeout=30000}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.sqlite.JDBC}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}   # Можно поставить create для первого запуска, потом update
    database-platform: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
          lob:
            non_contextual_creation: true
        globally_quoted_identifiers: true
        generate_statistics: false
    open-in-view: false
  sql:
    init:
      mode: never

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-not-for-production-32}
  expiration: ${JWT_EXPIRATION:86400000}

# === bePaid Payment Gateway ===
# Для проверки вебхуков (Content-Signature): в ЛК bePaid взять публичный ключ магазина (PEM)
# и вставить сюда. Иначе вебхуки принимаются только по Basic Auth (Shop ID + Secret key).
bepaid:
  shop-id: ${BEPAID_SHOP_ID:}
  secret-key: ${BEPAID_SECRET_KEY:}
  # Публичный RSA-ключ магазина из ЛК bePaid (проверка Content-Signature вебхуков)
  public-key: ${BEPAID_PUBLIC_KEY:}
  checkout-url: ${BEPAID_CHECKOUT_URL:https://checkout.bepaid.by/ctp/api/checkouts}
  return-url: ${BEPAID_RETURN_URL:https://fluvion.by/thanks}
  fail-url: ${BEPAID_FAIL_URL:https://fluvion.by/badResponse}
  callback-url: ${BEPAID_CALLBACK_URL:https://fluvion.by/api/payment/webhook}
  test-mode: ${BEPAID_TEST_MODE:true}

# === Eurotorg / Eupost API ===
eupost:
  api:
    url: ${EUPOST_API_URL:https://api.eurotorg.by:10352/Json}
  service:
    number: ${EUPOST_SERVICE_NUMBER:}
  login: ${EUPOST_LOGIN:}
  password: ${EUPOST_PASSWORD:}

# === CORS ===
# Настройки CORS для веб и мобильных приложений
# Для мобильного приложения добавьте exp://* или конкретный IP адрес
app:
  cors:
    allowed-origins: http://localhost:5173,https://fluvion.by,exp://*
